services:
  devcontainer:
    image: rawb-devcontainer:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${RAWB_SSH_PORT:-2255}:22"
    volumes:
      - type: bind
        source: /docker/pelican/mounts/old-dev/plugins/MagicSpells
        target: /workspace/old-dev
      - type: volume
        source: ssh-host-keys
        target: /etc/ssh/host-keys
    working_dir: /workspace/old-dev

volumes:
  ssh-host-keys:
